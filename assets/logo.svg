<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1035"/>
      <stop offset="100%" style="stop-color:#2d1b5e"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4a836"/>
      <stop offset="100%" style="stop-color:#e8832a"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf6e3"/>
      <stop offset="100%" style="stop-color:#f0e6c8"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff"/>
      <stop offset="100%" style="stop-color:#5c35cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#7c4dff" stroke-width="3" opacity="0.6"/>

  <!-- Web/network lines (spider web suggestion) -->
  <g opacity="0.18" stroke="#a78bfa" stroke-width="1.2" fill="none">
    <line x1="256" y1="60" x2="256" y2="452"/>
    <line x1="60" y1="256" x2="452" y2="256"/>
    <line x1="113" y1="113" x2="399" y2="399"/>
    <line x1="399" y1="113" x2="113" y2="399"/>
    <circle cx="256" cy="256" r="80"/>
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="195"/>
  </g>

  <!-- Book body (left cover) -->
  <rect x="118" y="155" width="148" height="195" rx="8" ry="8"
        fill="url(#bookGrad)" filter="url(#shadow)"/>

  <!-- Book spine -->
  <rect x="118" y="155" width="18" height="195" rx="4" ry="4"
        fill="#c47020"/>

  <!-- Book pages -->
  <rect x="136" y="163" width="122" height="179" rx="2" ry="2"
        fill="url(#pageGrad)"/>

  <!-- Text lines on page -->
  <g fill="#b8a080" opacity="0.7">
    <rect x="148" y="185" width="90" height="5" rx="2"/>
    <rect x="148" y="198" width="80" height="5" rx="2"/>
    <rect x="148" y="211" width="88" height="5" rx="2"/>
    <rect x="148" y="224" width="75" height="5" rx="2"/>
    <rect x="148" y="245" width="90" height="5" rx="2"/>
    <rect x="148" y="258" width="85" height="5" rx="2"/>
    <rect x="148" y="271" width="78" height="5" rx="2"/>
    <rect x="148" y="292" width="90" height="5" rx="2"/>
    <rect x="148" y="305" width="70" height="5" rx="2"/>
  </g>

  <!-- Book right page (open book effect) -->
  <rect x="258" y="163" width="118" height="179" rx="2" ry="2"
        fill="#fdf6e3" opacity="0.5"/>
  <g fill="#b8a080" opacity="0.35">
    <rect x="268" y="185" width="88" height="5" rx="2"/>
    <rect x="268" y="198" width="75" height="5" rx="2"/>
    <rect x="268" y="211" width="85" height="5" rx="2"/>
    <rect x="268" y="224" width="70" height="5" rx="2"/>
  </g>

  <!-- Book center crease -->
  <line x1="258" y1="163" x2="258" y2="342" stroke="#c8b090" stroke-width="2" opacity="0.6"/>

  <!-- AI speech bubble (top right) -->
  <g filter="url(#shadow)">
    <rect x="288" y="108" width="138" height="88" rx="16" ry="16"
          fill="url(#bubbleGrad)"/>
    <!-- Bubble tail -->
    <polygon points="300,196 320,196 308,218" fill="#5c35cc"/>
  </g>

  <!-- "AI" text in bubble -->
  <text x="357" y="142" text-anchor="middle"
        font-family="Georgia, serif" font-size="28" font-weight="bold"
        fill="#ffffff" filter="url(#glow)">AI</text>
  <!-- Chinese char in bubble -->
  <text x="357" y="178" text-anchor="middle"
        font-family="sans-serif" font-size="22" font-weight="bold"
        fill="#e8d5ff" opacity="0.9">译</text>

  <!-- Crawler indicator: small spider/cursor at bottom right of book -->
  <g transform="translate(340, 330)" filter="url(#glow)">
    <!-- Spider body -->
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#f4a836"/>
    <ellipse cx="0" cy="-14" rx="10" ry="8" fill="#e8832a"/>
    <!-- Legs -->
    <g stroke="#f4a836" stroke-width="2.5" stroke-linecap="round" fill="none">
      <line x1="-14" y1="-4" x2="-28" y2="-14"/>
      <line x1="-14" y1="0"  x2="-28" y2="2"/>
      <line x1="-14" y1="4"  x2="-26" y2="14"/>
      <line x1="14"  y1="-4" x2="28"  y2="-14"/>
      <line x1="14"  y1="0"  x2="28"  y2="2"/>
      <line x1="14"  y1="4"  x2="26"  y2="14"/>
    </g>
    <!-- Eyes -->
    <circle cx="-4" cy="-15" r="2.5" fill="#1a1035"/>
    <circle cx="4"  cy="-15" r="2.5" fill="#1a1035"/>
    <!-- Web thread -->
    <line x1="0" y1="-22" x2="0" y2="-48" stroke="#a78bfa" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Project name -->
  <text x="256" y="408" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="bold" letter-spacing="1"
        fill="#f4a836">FicCrawler</text>
  <text x="256" y="440" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-weight="bold" letter-spacing="2"
        fill="#a78bfa">Lingo</text>
</svg>
